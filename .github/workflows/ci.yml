name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: make test-ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # gofmt drift surfaces before the slower golangci-lint pass so a
      # formatting-only regression fails fast with the offending paths.
      - name: Format check
        run: make fmt-check

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # The graph-lint acceptance gate (RDR 0006). It is deliberately NOT the
  # `lint` job above — that one is golangci-lint and stays untouched. This
  # job builds the production binary and runs the shipped `lint` verb over
  # the checked-in transition model, so an illegal model cannot land.
  graph-lint:
    name: Graph lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      # The oracle is the JSON `code` field, not the exit integer alone: a
      # non-zero exit could come from an unreadable file or a schema
      # refusal, and the gate must distinguish those from a lint verdict.
      - name: Lint the checked-in transition model
        run: |
          set -o pipefail
          out=$(./bin/intrastate lint --model models/rdr.toml --as=json) || true
          echo "$out"
          code=$(printf '%s' "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("code",""))')
          if [ -n "$code" ]; then
            echo "graph lint refused the model with code: $code" >&2
            exit 1
          fi

      # The step above covers only $(MODEL). `make graph-lint` also lints
      # EXAMPLE_MODELS -- the worked examples docs/model-authoring.md walks
      # through -- so a broken one cannot silently falsify the authoring
      # doc. The subject list stays in the Makefile alone, so CI and local
      # `make check` cannot drift apart again.
      - name: Lint the example models
        run: make graph-lint

  # The generated-docs staleness gate. docs/cli-reference.md and llms.txt
  # are emitted from the live command tree, so a renamed finding code or a
  # reworded help body must not land with stale markdown beside it. The
  # oracle is a regenerate-then-diff against HEAD, the same one
  # `make docs-check` runs locally.
  docs:
    name: Generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify the committed reference matches the command tree
        run: make docs-check

  # Per-commit binaries for consumers that pin an exact revision. Runs only
  # on green `main` (and manual dispatch), because a snapshot a fetcher can
  # resolve must never come from a commit that failed its own gates —
  # `needs:` names every gate above for that reason.
  #
  # This is the UNTAGGED half of distribution. Tagged, publicly downloadable
  # builds are `release.yml`; both drive the same `.goreleaser.yaml`, this
  # one with `--snapshot` so nothing is published. One config, two paths.
  #
  # Consumers fetch with the GitHub CLI, resolving the artifact by name:
  #   gh run download <run-id> --repo cwensel/intrastate \
  #     --name intrastate-snapshot-<sha>
  # then verify the tarball against the bundled checksums.txt before use.
  # The artifact name embeds the commit SHA so a fetcher can pin a revision
  # rather than trusting "whatever is newest".
  snapshot:
    name: Snapshot build
    needs: [test, lint, vuln, graph-lint, docs]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # goreleaser derives the version from tag history, so it needs the
      # full history — a shallow clone silently yields a wrong version.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # intrastate is pure Go, so one ubuntu runner cross-compiles every
      # target. No per-OS matrix and no merge job — see .goreleaser.yaml.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      # Fail loudly rather than publish a binary that reports "dev": the
      # ldflags -X paths must track the module path, and nothing else in
      # the build catches that drift.
      - name: Verify the built binary reports its identity
        run: make release-check

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: intrastate-snapshot-${{ github.sha }}
          path: |
            dist/intrastate_*.tar.gz
            dist/intrastate_*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7
