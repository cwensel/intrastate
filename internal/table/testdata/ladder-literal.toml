# RDR 0030 MVV — the retry/escalation ladder, UNROLLED as authors write it
# today: one literal row per (cell, outcome). Every row carries exactly the
# atoms and writes its `ladder-step.toml` counterpart normalizes to, so the
# two models are the same table to every consumer.
outcomes = ["retry", "escalate", "succeed"]
terminal = ["done"]

[model]
id = "ladder"
version = 1

[initial]
status = "open"
attempt = 0
tier = "small"

[tags.recognized]
provenance = "recognized"
kind = "enum"
single_valued = true
required = true

[tags.status]
provenance = "owned"
kind = "enum"
domain = ["open", "done"]
single_valued = true
required = true

[tags.attempt]
provenance = "owned"
kind = "int"
min = 0
max = 9
single_valued = true
required = true

[tags.tier]
provenance = "owned"
kind = "enum"
domain = ["small", "mid", "large"]
single_valued = true
required = true

[read.state]
role = "state"
path = "flow.state"
keys = ["status", "attempt", "tier"]
timeout = "2s"

[write.state]
role = "state"
path = "flow.state"
keys = ["status", "attempt", "tier"]
timeout = "2s"
read_back = true

[context.open.match.status]
eq = "open"

[context.done.match.status]
eq = "done"

[[rule]]
id = "retry-0"
use = ["open"]
[rule.match.recognized]
eq = "retry"
[rule.guard.all.attempt]
eq = 0
gte = 0
lt = 5
[rule.write]
attempt = 1
status = "open"

[[rule]]
id = "retry-1"
use = ["open"]
[rule.match.recognized]
eq = "retry"
[rule.guard.all.attempt]
eq = 1
gte = 0
lt = 5
[rule.write]
attempt = 2
status = "open"

[[rule]]
id = "retry-2"
use = ["open"]
[rule.match.recognized]
eq = "retry"
[rule.guard.all.attempt]
eq = 2
gte = 0
lt = 5
[rule.write]
attempt = 3
status = "open"

[[rule]]
id = "retry-3"
use = ["open"]
[rule.match.recognized]
eq = "retry"
[rule.guard.all.attempt]
eq = 3
gte = 0
lt = 5
[rule.write]
attempt = 4
status = "open"

[[rule]]
id = "retry-4"
use = ["open"]
[rule.match.recognized]
eq = "retry"
[rule.guard.all.attempt]
eq = 4
gte = 0
lt = 5
[rule.write]
attempt = 5
status = "open"

[[rule]]
id = "retry-cap"
use = ["open"]
[rule.match.recognized]
eq = "retry"
[rule.guard.all.attempt]
gte = 5
[rule.write]
status = "done"

[[rule]]
id = "escalate-small"
use = ["open"]
[rule.match.recognized]
eq = "escalate"
[rule.guard.all.tier]
eq = "small"
in = ["small", "mid"]
[rule.write]
tier = "mid"
attempt = 0

[[rule]]
id = "escalate-mid"
use = ["open"]
[rule.match.recognized]
eq = "escalate"
[rule.guard.all.tier]
eq = "mid"
in = ["small", "mid"]
[rule.write]
tier = "large"
attempt = 0

[[rule]]
id = "escalate-cap"
use = ["open"]
[rule.match.recognized]
eq = "escalate"
[rule.guard.all.tier]
eq = "large"
[rule.write]
status = "done"

[[rule]]
id = "succeed"
use = ["open"]
[rule.match.recognized]
eq = "succeed"
[rule.write]
status = "done"
