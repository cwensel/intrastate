# kata wchf negative fixture: the read entry declares `select` tables but none for its `owner` key.
outcomes = ["advance"]
terminal = ["done"]

[model]
id = "kataflow"
version = 1

[tags.recognized]
provenance = "recognized"
kind = "enum"
single_valued = true
required = true

[tags.id]
provenance = "observed"
kind = "scalar"

[tags.owner]
provenance = "observed"
kind = "scalar"

[tags.lifecycle]
provenance = "owned"
kind = "enum"
domain = ["queued", "shipping"]
single_valued = true
required = true

[read.kata]
role = "kata"
command = ["kata", "show", "{tag.id}", "--json"]
keys = ["lifecycle", "owner"]
timeout = "2s"

[read.kata.select.lifecycle]
pointer = "/labels"
element = "/label"
prefix = "lifecycle:"

[write.kata]
role = "kata"
command = ["tools/kata-label", "{tag.id}"]
keys = ["lifecycle"]
timeout = "2s"
read_back = true

[initial]
lifecycle = "queued"

[context.done]
[context.done.match.lifecycle]
eq = "shipping"

[[rule]]
id = "ship"
[rule.match.lifecycle]
eq = "queued"
[rule.match.recognized]
eq = "advance"
[rule.write]
lifecycle = "shipping"
