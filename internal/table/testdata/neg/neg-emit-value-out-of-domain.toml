# RDR 0024 `0024:S6` witness — `emit_value_out_of_domain`.
#
# SINGLE DEFECT by construction: every emitted key is declared, and
# `cell-y` authors `verdict = "not-a-member"`, outside the declared enum
# domain. The fixture trips this category and no other (REQ-105
# exclusivity leg).
outcomes = ["decide"]

[model]
id = "emit-witness"
version = 1
class = "decision-table"

[tags.recognized]
provenance = "recognized"
kind = "enum"
single_valued = true
required = true

[tags.a]
provenance = "observed"
kind = "enum"
domain = ["x", "y"]
single_valued = true
required = true

[emit.verdict]
kind = "enum"
domain = ["alpha", "beta"]

[[rule]]
id = "cell-x"
[rule.match.recognized]
eq = "decide"
[rule.guard.all.a]
eq = "x"
[rule.emit]
verdict = "alpha"

[[rule]]
id = "cell-y"
[rule.match.recognized]
eq = "decide"
[rule.guard.all.a]
eq = "y"
[rule.emit]
verdict = "not-a-member"
