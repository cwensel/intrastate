# RDR 0024 `0024:S6` witness — `malformed_emit_declaration`.
#
# SINGLE DEFECT by construction: `[emit.verdict]` declares `kind =
# "gauge"`, which is outside C1's closed set `enum | bool | int | scalar`.
# Everything else in this document loads clean, so the fixture trips this
# category and no other (REQ-105 exclusivity leg).
outcomes = ["decide"]

[model]
id = "emit-witness"
version = 1
class = "decision-table"

[tags.recognized]
provenance = "recognized"
kind = "enum"
single_valued = true
required = true

[tags.a]
provenance = "observed"
kind = "enum"
domain = ["x", "y"]
single_valued = true
required = true

[emit.verdict]
kind = "gauge"

[[rule]]
id = "cell-x"
[rule.match.recognized]
eq = "decide"
[rule.guard.all.a]
eq = "x"
[rule.emit]
verdict = "alpha"

[[rule]]
id = "cell-y"
[rule.match.recognized]
eq = "decide"
[rule.guard.all.a]
eq = "y"
[rule.emit]
verdict = "beta"
