# A1 spike model. Generated by gen.py. 9 bool observed dims -> 512 cells.
outcomes = ["decide"]
terminal = ["done"]

[model]
id = "a1-spike-baseline"
version = 1
description = "A1 spike: scratch-tag baseline arm."

[model.metadata]
owner = "rdr-0010-spike"

# --- the scratch owned tag (the PoC convention) ---------------------
[tags.phase]
provenance = "owned"
kind = "enum"
domain = ["start", "done"]
single_valued = true
required = true

# --- the 9 observed decision dimensions -----------------------------
[tags.d0]
provenance = "observed"
kind = "bool"
single_valued = true
required = true

[tags.d1]
provenance = "observed"
kind = "bool"
single_valued = true
required = true

[tags.d2]
provenance = "observed"
kind = "bool"
single_valued = true
required = true

[tags.d3]
provenance = "observed"
kind = "bool"
single_valued = true
required = true

[tags.d4]
provenance = "observed"
kind = "bool"
single_valued = true
required = true

[tags.d5]
provenance = "observed"
kind = "bool"
single_valued = true
required = true

[tags.d6]
provenance = "observed"
kind = "bool"
single_valued = true
required = true

[tags.d7]
provenance = "observed"
kind = "bool"
single_valued = true
required = true

[tags.d8]
provenance = "observed"
kind = "bool"
single_valued = true
required = true

[tags.recognized]
provenance = "recognized"
kind = "enum"
single_valued = true
required = true

[read.scratch]
role = "scratch"
path = "scratch.phase"
keys = ["phase"]
timeout = "2s"

[write.scratch]
role = "scratch"
path = "scratch.phase"
keys = ["phase"]
timeout = "2s"
read_back = true

[initial]
phase = "start"

[context.done.match.phase]
eq = "done"

# --- the table -------------------------------------------------------
[[rule]]
id = "r001"
source = "spike"
[rule.match.recognized]
eq = "decide"
[rule.guard.all.d0]
eq = "false"
[rule.write]
phase = "start"

[[rule]]
id = "r002"
source = "spike"
[rule.match.recognized]
eq = "decide"
[rule.guard.all.d0]
eq = "true"
[rule.guard.all.d1]
eq = "false"
[rule.write]
phase = "start"

[[rule]]
id = "r003"
source = "spike"
[rule.match.recognized]
eq = "decide"
[rule.guard.all.d0]
eq = "true"
[rule.guard.all.d1]
eq = "true"
[rule.guard.all.d2]
eq = "false"
[rule.write]
phase = "start"

[[rule]]
id = "r004-dims"
source = "spike"
[rule.match.recognized]
eq = "decide"
[rule.guard.all.d0]
eq = "false"
[rule.guard.all.d1]
eq = "false"
[rule.guard.all.d2]
eq = "false"
[rule.guard.all.d3]
eq = "false"
[rule.guard.all.d4]
eq = "false"
[rule.guard.all.d5]
eq = "false"
[rule.guard.all.d6]
eq = "false"
[rule.guard.all.d7]
eq = "false"
[rule.guard.all.d8]
eq = "false"
[rule.write]
phase = "start"

